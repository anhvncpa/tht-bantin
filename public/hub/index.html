<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THT Agent Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F6F7F9;--panel:#FFFFFF;--ink:#16202A;--muted:#66737F;--line:#E4E8EC;--soft:#F0F3F6;--brand:#E8590C;--ok:#2B8A3E;--run:#1C7ED6;--wait:#E67700;--err:#E03131;--idle:#868E96;--shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F141A;--panel:#171E26;--ink:#E7ECF1;--muted:#93A1AE;--line:#26313C;--soft:#1D2630;--shadow:none}}
:root[data-theme="dark"]{--bg:#0F141A;--panel:#171E26;--ink:#E7ECF1;--muted:#93A1AE;--line:#26313C;--soft:#1D2630;--shadow:none}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
a{color:inherit}button{font:inherit;cursor:pointer}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;text-decoration:none}
.logo span.b{width:34px;height:34px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px;letter-spacing:.5px}
.spacer{flex:1}.muted{color:var(--muted)}.small{font-size:12.5px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;border-radius:8px}
.btn:hover{background:var(--soft)}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.kpi{padding:14px 16px}.kpi .v{font-size:24px;font-weight:700;line-height:1.2}.kpi .l{color:var(--muted);font-size:12.5px}
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
h2{font-size:15px;margin:0 0 10px;font-weight:600}
.section{padding:14px 16px}
.agents{display:grid;gap:10px}
.agent{display:flex;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);text-align:left;width:100%;color:inherit}
.agent:hover{border-color:var(--brand)}
.ico{flex-shrink:0;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:20px;background:var(--soft)}
.agent .name{font-weight:600}.agent .now{font-size:13px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;background:var(--soft);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--idle)}
.s-running .dot{background:var(--run);animation:pulse 1.4s infinite}.s-running{color:var(--run)}
.s-waiting .dot{background:var(--wait)}.s-waiting{color:var(--wait)}
.s-done .dot{background:var(--ok)}.s-done{color:var(--ok)}
.s-error .dot{background:var(--err)}.s-error{color:var(--err)}
.s-idle{color:var(--idle)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(28,126,214,.5)}70%{box-shadow:0 0 0 6px rgba(28,126,214,0)}100%{box-shadow:0 0 0 0 rgba(28,126,214,0)}}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.feed li:last-child{border-bottom:0}.feed li:hover{background:var(--soft)}
.feed .t{font-size:13.5px}.feed .meta{font-size:12px;color:var(--muted)}
.si{flex-shrink:0;width:22px;text-align:center}
.flow{display:flex;flex-wrap:wrap;gap:8px 0;align-items:center;padding:6px 0 4px}
.node{min-width:118px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);text-align:center}
.node .lb{font-weight:600;font-size:13px}.node .ct{font-size:12px;color:var(--muted)}
.node.cur{border-color:var(--run);box-shadow:0 0 0 3px rgba(28,126,214,.15)}
.node.cur.wait{border-color:var(--wait);box-shadow:0 0 0 3px rgba(230,119,0,.15)}
.node.cur.err{border-color:var(--err);box-shadow:0 0 0 3px rgba(224,49,49,.15)}
.node.cur.ok{border-color:var(--ok);box-shadow:0 0 0 3px rgba(43,138,62,.15)}
.arrow{width:22px;text-align:center;color:var(--muted)}
table{width:100%;border-collapse:collapse}td,th{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:13.5px}
th{font-size:12px;color:var(--muted);font-weight:600}tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tl{list-style:none;margin:0;padding:0 0 0 6px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 14px 18px}
.tl li::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--panel);border:2px solid var(--idle)}
.tl li.start::before{border-color:var(--run)}.tl li.done::before{border-color:var(--ok);background:var(--ok)}
.tl li.waiting::before{border-color:var(--wait)}.tl li.error::before{border-color:var(--err);background:var(--err)}
.tl li.ai{padding-bottom:6px}.tl li.ai::before{width:8px;height:8px;left:-5px;top:7px;border-color:var(--line)}
.tl li.ai .tt{font-size:12.5px;color:var(--muted)}
.tl .tt{font-weight:500}.chip{font-size:11.5px;padding:1px 7px;border-radius:6px;background:var(--soft);color:var(--muted);margin-right:6px}
details{margin-top:4px}summary{cursor:pointer;color:var(--brand);font-size:12.5px}
pre{white-space:pre-wrap;word-break:break-word;background:var(--soft);padding:10px 12px;border-radius:8px;font:12.5px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;margin:6px 0 0;max-height:420px;overflow:auto}
.crumbs{display:flex;gap:6px;align-items:center;margin-bottom:12px;font-size:13.5px}
.crumbs a{color:var(--muted);text-decoration:none}.crumbs a:hover{color:var(--brand)}
.login{max-width:360px;margin:12vh auto;padding:24px}
.login input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit;margin:12px 0}
.empty{padding:28px;text-align:center;color:var(--muted)}
.err-msg{color:var(--err);font-size:13px}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.hide-sm{display:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const store = { get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }, set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (_) {} } };
  let KEY = store.get("thtHubKey") || "", timer = null, cache = {};
  const ST = { running: ["Đang chạy", "s-running"], start: ["Đang chạy", "s-running"], waiting: ["Chờ anh duyệt", "s-waiting"], done: ["Xong", "s-done"], error: ["Lỗi", "s-error"], idle: ["Nghỉ", "s-idle"] };
  const SI = { start: "▶️", done: "✅", waiting: "⏳", error: "⛔", info: "ℹ️", ai: "🧠" };
  const pill = (st) => { const [t, c] = ST[st] || ST.idle; return `<span class="pill ${c}"><span class="dot"></span>${t}</span>`; };
  const ago = (ts) => { if (!ts) return "—"; const s = (Date.now() - Date.parse(ts)) / 1000; if (s < 60) return "vừa xong"; if (s < 3600) return `${Math.floor(s / 60)} phút trước`; if (s < 86400) return `${Math.floor(s / 3600)} giờ trước`; return new Date(ts).toLocaleString("vi-VN", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }); };
  const time = (ts) => new Date(ts).toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" });
  const money = (n) => `$${(n || 0).toFixed((n || 0) < 1 ? 3 : 2)}`;
  const steps = (a) => { try { return JSON.parse(a.steps || "[]"); } catch (_) { return []; } };
  const stepLabel = (a, id) => (steps(a).find((s) => s.id === id) || {}).label || id || "";

  async function api(path) {
    const r = await fetch("/hub/api" + path, { headers: { "x-app-key": KEY } });
    if (r.status === 401) { KEY = ""; store.set("thtHubKey", null); render(); throw new Error("auth"); }
    const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); return j;
  }

  function shell(inner, sub) {
    return `<header><a class="logo" href="#/"><span class="b">THT</span>Agent Hub</a><span class="muted small hide-sm">${esc(sub || "Theo dõi các AI Agent của THT")}</span>
      <span class="spacer"></span><span class="muted small hide-sm" id="upd"></span><button class="btn" id="rf" title="Làm mới">↻</button><button class="btn" id="out">Thoát</button></header>${inner}`;
  }
  function bindShell() { $("#rf").onclick = () => route(); $("#out").onclick = () => { store.set("thtHubKey", null); KEY = ""; render(); }; $("#upd").textContent = "Cập nhật " + new Date().toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit", second: "2-digit" }); }

  function login() {
    $("#app").innerHTML = `<div class="card login"><div class="logo" style="margin-bottom:6px"><span class="b">THT</span>Agent Hub</div>
      <div class="muted">Nhập mật khẩu ứng dụng (giống trang soạn bản tin) để xem các AI Agent đang làm gì.</div>
      <form id="f"><input id="pw" type="password" autocomplete="current-password" placeholder="Mật khẩu"><button class="btn primary" style="width:100%">Vào Hub</button><div class="err-msg" id="em"></div></form></div>`;
    $("#f").onsubmit = async (e) => { e.preventDefault(); KEY = $("#pw").value.trim(); try { await api("/overview"); store.set("thtHubKey", KEY); route(); } catch (_) { $("#em").textContent = "Sai mật khẩu, anh thử lại."; } };
  }

  async function home() {
    const d = await api("/overview"); cache.agents = Object.fromEntries(d.agents.map((a) => [a.id, a]));
    const stat = Object.fromEntries(d.stats.map((s) => [s.agent_id, s])), latest = Object.fromEntries(d.latest.map((r) => [r.agent_id, r]));
    const agents = d.agents.map((a) => {
      const r = latest[a.id] || {}, s = stat[a.id] || {};
      const st = r.status === "running" && Date.now() - Date.parse(r.updated_at) > 30 * 60e3 ? "idle" : r.status || "idle";
      return `<button class="agent" data-a="${esc(a.id)}"><div class="ico" style="color:${esc(a.color)}">${esc(a.icon)}</div><div style="min-width:0;flex:1">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="name">${esc(a.name)}</span>${pill(st)}</div>
        <div class="now">${r.title ? `${esc(stepLabel(a, r.step))} · ${esc(r.title)}` : esc(a.description)}</div>
        <div class="small muted" style="margin-top:4px">Hoạt động ${ago(a.last_seen)} · 24h: ${s.n || 0} sự kiện${s.err ? `, <span class="s-error">${s.err} lỗi</span>` : ""} · ${money(s.cost)}</div></div></button>`;
    }).join("") || `<div class="empty">Chưa có agent nào gửi nhật ký.</div>`;
    const feed = d.recent.map((e) => { const a = cache.agents[e.agent_id] || {};
      return `<li data-r="${esc(e.run_id)}"><span class="si">${SI[e.status] || "•"}</span><div style="min-width:0"><div class="t">${esc(e.title)}</div>
        <div class="meta">${esc(a.icon || "🤖")} ${esc(a.name || e.agent_id)} · ${esc(stepLabel(a, e.step))} · ${ago(e.ts)}${e.run_title ? " · " + esc(e.run_title).slice(0, 70) : ""}</div></div></li>`; }).join("") || `<li class="empty">Chưa có hoạt động.</li>`;
    const t = d.totals;
    $("#app").innerHTML = shell(`
      <div class="kpis">
        <div class="card kpi"><div class="v s-running">${t.running}</div><div class="l">Việc đang chạy</div></div>
        <div class="card kpi"><div class="v s-waiting">${t.waiting}</div><div class="l">Chờ anh duyệt</div></div>
        <div class="card kpi"><div class="v ${t.errors_24h ? "s-error" : ""}">${t.errors_24h}</div><div class="l">Lỗi 24 giờ qua</div></div>
        <div class="card kpi"><div class="v">${money(t.cost_month)}</div><div class="l">Chi phí AI tháng này (ước tính)</div></div>
      </div>
      <div class="grid"><div class="card section"><h2>AI Agent (${d.agents.length})</h2><div class="agents">${agents}</div></div>
      <div class="card section"><h2>Hoạt động gần đây</h2><ul class="feed">${feed}</ul></div></div>`);
    bindShell();
    document.querySelectorAll("[data-a]").forEach((b) => (b.onclick = () => (location.hash = "#/agent/" + b.dataset.a)));
    document.querySelectorAll("[data-r]").forEach((b) => (b.onclick = () => (location.hash = "#/run/" + encodeURIComponent(b.dataset.r))));
  }

  async function agentView(id) {
    const d = await api("/agent/" + id), a = d.agent; cache.agents = { ...(cache.agents || {}), [a.id]: a };
    const cnt = Object.fromEntries(d.steps.map((s) => [s.step, s])), last = d.runs[0] || {};
    const cls = { running: "", waiting: "wait", error: "err", done: "ok" }[last.status] ?? "";
    const flow = steps(a).map((s, i) => `${i ? '<span class="arrow">→</span>' : ""}<div class="node ${last.step === s.id ? "cur " + cls : ""}"><div class="lb">${esc(s.label)}</div>
      <div class="ct">${cnt[s.id]?.n || 0} lần / 7 ngày${cnt[s.id]?.err ? ` · <span class="s-error">${cnt[s.id].err} lỗi</span>` : ""}</div></div>`).join("") || `<div class="muted">Agent chưa khai báo các bước.</div>`;
    const rows = d.runs.map((r) => `<tr class="click" data-r="${esc(r.id)}"><td>${esc(r.title)}<div class="small muted">${esc(stepLabel(a, r.step))}</div></td><td>${pill(r.status)}</td>
      <td class="num">${money(r.cost)}</td><td class="num muted hide-sm">${ago(r.updated_at)}</td></tr>`).join("") || `<tr><td colspan="4" class="empty">Chưa có lượt chạy.</td></tr>`;
    $("#app").innerHTML = shell(`<div class="crumbs"><a href="#/">Tổng quan</a><span class="muted">›</span><span>${esc(a.icon)} ${esc(a.name)}</span></div>
      <div class="card section" style="margin-bottom:16px"><h2>Luồng xử lý</h2><div class="muted small" style="margin-bottom:8px">${esc(a.description)}</div><div class="flow">${flow}</div>
      ${last.title ? `<div class="small" style="margin-top:8px">Lượt gần nhất: <b>${esc(last.title)}</b> · ${pill(last.status)} · ${ago(last.updated_at)}</div>` : ""}</div>
      <div class="card section"><h2>Các lượt chạy</h2><table><thead><tr><th>Việc</th><th>Trạng thái</th><th class="num">Chi phí AI</th><th class="num hide-sm">Cập nhật</th></tr></thead><tbody>${rows}</tbody></table></div>`, a.name);
    bindShell();
    document.querySelectorAll("[data-r]").forEach((b) => (b.onclick = () => (location.hash = "#/run/" + encodeURIComponent(b.dataset.r))));
  }

  async function runView(id) {
    const d = await api("/run/" + encodeURIComponent(id)); if (!d.run) { $("#app").innerHTML = shell(`<div class="card empty">Không tìm thấy lượt chạy này.</div>`); bindShell(); return; }
    let a = (cache.agents || {})[d.run.agent_id]; if (!a) { a = (await api("/agent/" + d.run.agent_id)).agent; }
    const aiCost = d.events.filter((e) => e.status === "ai").reduce((s, e) => s + (e.cost || 0), 0);
    const tl = d.events.map((e) => `<li class="${esc(e.status)}"><div class="small muted"><span class="chip">${esc(stepLabel(a, e.step))}</span>${time(e.ts)}</div>
      <div class="tt">${e.status === "ai" ? "🧠 " : ""}${esc(e.title)}</div>${e.detail ? `<details${e.status === "error" ? " open" : ""}><summary>Xem chi tiết AI đã nghĩ</summary><pre>${esc(e.detail)}</pre></details>` : ""}</li>`).join("");
    $("#app").innerHTML = shell(`<div class="crumbs"><a href="#/">Tổng quan</a><span class="muted">›</span><a href="#/agent/${esc(a.id)}">${esc(a.icon)} ${esc(a.name)}</a><span class="muted">›</span><span>Lượt chạy</span></div>
      <div class="card section"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px"><h2 style="margin:0">${esc(d.run.title)}</h2>${pill(d.run.status)}</div>
      <div class="small muted" style="margin-bottom:14px">Bắt đầu ${ago(d.run.started_at)} · ${d.events.length} sự kiện · chi phí AI ${money(aiCost)}</div><ul class="tl">${tl}</ul></div>`, a.name);
    bindShell();
  }

  async function route() {
    clearTimeout(timer);
    if (!KEY) return login();
    const h = location.hash.replace(/^#\/?/, ""); let m;
    try {
      if ((m = h.match(/^agent\/(.+)$/))) await agentView(m[1]);
      else if ((m = h.match(/^run\/(.+)$/))) await runView(decodeURIComponent(m[1]));
      else await home();
    } catch (e) { if (e.message !== "auth") { $("#app").innerHTML = shell(`<div class="card empty">Không tải được dữ liệu: ${esc(e.message)}</div>`); bindShell(); } }
    if (KEY) timer = setTimeout(route, 15000);
  }
  const render = route;
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
