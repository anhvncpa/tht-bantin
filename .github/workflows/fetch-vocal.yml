name: fetch-vocal
# Tự lấy ~10 bài nhạc CÓ LỜI mới (CC BY, ccMixter) vào music/vocal/ ngày 1 hằng tháng, 9:17 sáng giờ VN.
# Chạy tay: Actions → fetch-vocal → Run workflow.
on:
  schedule:
    - cron: "17 2 1 * *"
  workflow_dispatch:
    inputs:
      so_bai: { description: "Số bài", required: false, default: "10" }

permissions:
  contents: write

concurrency:
  group: fetch-vocal

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Cài ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Lấy nhạc có lời
        run: python video/fetch_vocal.py "${{ inputs.so_bai || '10' }}"
      - name: Lưu vào repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A music/vocal
          git diff --cached --quiet && echo "Không có thay đổi" && exit 0
          git commit -m "Nhạc có lời tháng $(date -u +%m/%Y) (CC BY, ccMixter)"
          git push
